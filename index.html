<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>La Ciudad que Perdió la Navidad</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071321;color:#fff}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wake{min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#17344f 0,#0a1b2c 40%,#040a12 78%)}.card{text-align:center;padding:28px;width:min(92vw,520px)}.dance{display:block;width:min(58vw,240px);height:auto;margin:0 auto 22px;filter:drop-shadow(0 18px 32px #0008)}h1{margin:0;font:600 clamp(24px,5vw,38px)/1.15 Georgia,serif;color:#fff3d0}.dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}p{margin:12px 0 0;color:#c7d6e5;font-size:14px}.retry{margin-top:18px;border:1px solid #e8c87a88;background:#10253a;color:#ffe9b4;border-radius:24px;padding:10px 16px;display:none}@media(max-width:600px){.dance{width:min(70vw,220px)}.card{padding:20px}}@media(prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}</style>
</head>
<body>
<main class="wake"><section class="card" aria-live="polite"><img class="dance" src="/trump-dance.gif" alt=""><h1>Despertando la Navidad<span class="dots"></span></h1><p id="status">Preparando la ciudad.</p><button class="retry" id="retry">Reintentar</button></section></main>
<script>
const statusEl=document.getElementById('status'),retry=document.getElementById('retry');let stopped=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function wake(){retry.style.display='none';stopped=false;const started=Date.now();while(!stopped&&Date.now()-started<120000){try{const r=await fetch('/_experience',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.ok){const html=await r.text();if(html.includes('id="experience"')){statusEl.textContent='La ciudad está lista.';document.open();document.write(html);document.close();return}}}catch{}statusEl.textContent='Encendiendo luces y preparando la ciudad…';await sleep(2500)}statusEl.textContent='La ciudad está tardando más de lo normal.';retry.style.display='inline-block'}
retry.addEventListener('click',wake);wake();
</script>
</body></html>
